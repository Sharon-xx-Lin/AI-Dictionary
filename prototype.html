<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="1; url=https://ais-pre-zielxfovdhdlzrq2rtzfrw-470661820727.asia-east1.run.app">
  <title>AI Dictionary 原型直达 / Prototype Access</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    body {
      background-color: #fef08a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      border: 4px solid #000000;
      border-radius: 24px;
      padding: 36px 28px;
      max-width: 540px;
      width: 100%;
      box-shadow: 10px 10px 0px 0px #000000;
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: #4ade80;
      border: 2px solid #000;
      font-weight: 900;
      font-size: 13px;
      padding: 4px 12px;
      border-radius: 999px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 32px;
      font-weight: 900;
      color: #000;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }
    p {
      color: #374151;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: block;
      width: 100%;
      background: #000000;
      color: #ffffff;
      border: 3px solid #000000;
      font-size: 17px;
      font-weight: 800;
      padding: 16px;
      border-radius: 16px;
      text-decoration: none;
      box-shadow: 4px 4px 0px 0px #38bdf8;
      cursor: pointer;
      transition: all 0.15s ease;
      margin-bottom: 12px;
    }
    .btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px 0px #38bdf8;
    }
    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px 0px #38bdf8;
    }
    .btn-secondary {
      background: #ffffff;
      color: #000000;
      box-shadow: 4px 4px 0px 0px #000000;
    }
    .btn-secondary:hover {
      background: #f3f4f6;
      box-shadow: 6px 6px 0px 0px #000000;
    }
    .countdown {
      font-size: 13px;
      color: #6b7280;
      margin-top: 18px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">🚀 Online Prototype</div>
    <h1>AI Dictionary 原型</h1>
    <p>正在自动跳转到在线交互原型... 如未自动跳转，请点击下方按钮直接访问：</p>
    
    <a class="btn" href="https://ais-pre-zielxfovdhdlzrq2rtzfrw-470661820727.asia-east1.run.app" target="_blank" rel="noopener noreferrer">
      👉 立即打开原型 (Shared App)
    </a>

    <a class="btn btn-secondary" href="https://ais-dev-zielxfovdhdlzrq2rtzfrw-470661820727.asia-east1.run.app" target="_blank" rel="noopener noreferrer">
      🛠️ 开发者预览地址 (Dev App)
    </a>

    <div class="countdown" id="timer">正在前往原型页面...</div>
  </div>

  <script>
    const targetUrl = "https://ais-pre-zielxfovdhdlzrq2rtzfrw-470661820727.asia-east1.run.app";
    let seconds = 2;
    const timerElem = document.getElementById("timer");
    const interval = setInterval(() => {
      seconds--;
      if (seconds <= 0) {
        clearInterval(interval);
        window.location.href = targetUrl;
      } else {
        timerElem.textContent = seconds + " 秒后自动跳转...";
      }
    }, 1000);
  </script>
</body>
</html>
